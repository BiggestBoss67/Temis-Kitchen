<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Temi's Kitchen</title>
    
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">

    <!-- All CSS Styles Embedded Directly -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Dark High-Quality Background */
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(15, 12, 12, 0.8), rgba(15, 12, 12, 0.9)),
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation Bar */
        header {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #d4af37;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: #f1f1f1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        nav ul li a:hover {
            color: #d4af37;
            background-color: rgba(212, 175, 55, 0.1);
        }

        /* Main Container Layout */
        main {
            flex: 1;
            max-width: 800px;
            width: 90%;
            margin: 40px auto;
        }

        /* Glassmorphism Form Card */
        .enquiry-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #d4af37;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            text-align: center;
            color: #cccccc;
            margin-bottom: 30px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #888888;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        select option {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 14px;
            background-color: #d4af37;
            color: #111111;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Footer */
        footer {
            background-color: rgba(15, 15, 15, 0.95);
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #888888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Semantic Header -->
    <header>
        <h1>Temi's Kitchen</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="enquiry-section">
            <h2>Catering & Event Enquiry</h2>
            <p>Please fill out the details below and our team will get back to you shortly.</p>

            <form action="#" method="POST" class="enquiry-form">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g., John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="e.g., john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., +27 12 345 6789" required>
                </div>

                <div class="form-group">
                    <label for="serviceType">Service Type:</label>
                    <select id="serviceType" name="serviceType" required>
                        <option value="" disabled selected>-- Select a Service --</option>
                        <option value="event-catering">Event Catering</option>
                        <option value="private-chef">Private Chef Service</option>
                        <option value="corporate-lunch">Corporate Lunch Box</option>
                        <option value="general-inquiry">General Inquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eventDate">Event Date:</label>
                    <input type="date" id="eventDate" name="eventDate" required>
                </div>

                <div class="form-group">
                    <label for="guestCount">Number of Guests:</label>
                    <input type="number" id="guestCount" name="guestCount" min="1" placeholder="e.g., 50" required>
                </div>

                <div class="form-group">
                    <label for="comments">Additional Comments / Special Requests:</label>
                    <textarea id="comments" name="comments" rows="5" placeholder="Tell us more about your event requirements..."></textarea>
                </div>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Temi's Kitchen. All rights reserved.</p>
    </footer>

</body>
</html>
